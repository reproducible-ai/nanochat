  command: |
    set -euo pipefail
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row024-venv/bin:$PATH

    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n train_tokenizer --wandb-to-trackio -- env NANOCHAT_BASE_DIR=outputs/nanochat python -m scripts.tok_train
  trace: off

