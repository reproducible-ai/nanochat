    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n evaluate_tokenizer --wandb-to-trackio -- env NANOCHAT_BASE_DIR=outputs/nanochat python -m scripts.tok_eval
