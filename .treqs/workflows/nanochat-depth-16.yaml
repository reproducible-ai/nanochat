    roar run -n package_model --wandb-to-trackio -- python reproduction/package_model.py
  trace: off

label:
  command: |
    set -euo pipefail
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact outputs/nanochat-depth16.tar.gz model.name=nanochat-depth-16 model.version=depth-16 license.id=MIT license.name='MIT License' description='nanochat depth-16 full pipeline on ClimbMix-400B: tokenizer, compute-optimal pretraining, supervised fine-tuning, and evaluation.' documentation.url=https://github.com/karpathy/nanochat/blob/92d63d4e8bb4df75c3b71618f31ddde2378b2bcd/README.md
  trace: off

publish:
  # Publish this step's artifact under the project's identity, not anonymously.
  glaas_creds: true
  command: |
    set -euo pipefail
    export PATH=/opt/pytorch/bin:$PATH
    roar status --untracked-dirs
    roar put outputs/nanochat-depth16.tar.gz hf://reproducible-ai/nanochat-depth-16 --public --yes --no-tag -m "nanochat depth-16 full pipeline on ClimbMix-400B with the upstream token horizon, followed by supervised fine-tuning and evaluation."
  trace: off
