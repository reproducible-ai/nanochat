    roar run -n pretrain_depth16 --wandb-to-trackio -- env NANOCHAT_BASE_DIR=outputs/nanochat python -m scripts.base_train --depth=16 --target-param-data-ratio=8 --device-batch-size=32 --fp8 --model-tag=depth16 --run=nanochat-depth16
  trace: off

